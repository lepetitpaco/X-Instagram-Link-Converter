<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    /* Thème sombre aux couleurs de l'icône (dégradé bleu-violet-rose), police système : aucune ressource distante */
    :root {
      --bg: #0d0c14;
      --card: #17161f;
      --card-2: #201f2b;
      --line: rgba(255, 255, 255, .08);
      --ink: #f1f0f7;
      --muted: #a6a4b8;
      --accent: #9b4dff;
      --grad: linear-gradient(135deg, #4f6bff 0%, #9b4dff 55%, #ff4f8b 100%);
      --error: #ff7a8a;
      --ok: #7bd88f;
      color-scheme: dark;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 0 14px 14px;
      width: 330px;
      margin: 0;
      max-height: 600px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
    }

    .brand {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 -14px 12px;
      padding: 12px 14px;
      background: linear-gradient(180deg, var(--bg) 70%, rgba(13, 12, 20, 0));
    }

    .brand img {
      width: 28px;
      height: 28px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 14px;
    }

    .brand-tagline {
      color: var(--muted);
      font-size: 11px;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .stats-item {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .stats-item:last-child {
      grid-column: 1 / -1;
    }

    .stats-item strong {
      color: var(--ink);
      font-weight: 600;
    }

    button {
      width: 100%;
      margin: 5px 0;
      padding: 9px 12px;
      border: none;
      border-radius: 10px;
      background: var(--grad);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s ease, transform .15s ease;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:disabled {
      background: var(--card-2);
      color: var(--muted);
      cursor: not-allowed;
      filter: none;
    }

    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 20px;
    }

    #status:empty {
      display: none;
    }

    .status-success {
      background: rgba(123, 216, 143, .12);
      color: var(--ok);
    }

    .status-error {
      background: rgba(255, 122, 138, .12);
      color: var(--error);
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 12px 0;
    }

    .section {
      margin-bottom: 12px;
    }

    /* Boutons de copie : cartes sobres, la bordure prend la couleur d'accent au survol */
    .section button {
      margin: 4px 0;
      padding: 8px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 500;
      text-align: left;
    }

    .section button:hover {
      filter: none;
      border-color: var(--accent);
    }

    .settings-section {
      margin-top: 4px;
    }

    .services-platform {
      margin: 6px 0;
      padding: 4px 10px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 12px;
    }

    .services-platform[open] {
      padding-bottom: 10px;
    }

    .services-platform summary,
    .changelog summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--ink);
      padding: 6px 0;
    }

    .service-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 5px 0;
    }

    .service-row input[type="checkbox"] {
      margin: 0 2px 0 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .service-row input[type="text"] {
      min-width: 0;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
    }

    .service-row input[type="text"]:focus {
      border-color: var(--accent);
    }

    .service-row .service-label {
      width: 38px;
      flex: 0 0 auto;
    }

    .service-row .service-domain {
      flex: 1;
    }

    .service-row.invalid input[type="text"] {
      border-color: var(--error);
    }

    .services-error {
      color: var(--error);
      font-size: 11px;
      min-height: 0;
    }

    .services-error:empty {
      display: none;
    }

    .services-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    button.editor-btn {
      width: auto;
      margin: 0;
      padding: 4px 9px;
      border-radius: 7px;
      background: var(--card-2);
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
    }

    button.editor-btn:hover {
      filter: none;
      background: #2a2938;
    }

    button.editor-btn:disabled {
      background: transparent;
      color: #55536a;
    }

    .history-section {
      margin-top: 4px;
    }

    .history-item {
      padding: 8px 10px;
      margin: 5px 0;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 11px;
      cursor: pointer;
      transition: border-color .15s;
    }

    .history-item:hover {
      border-color: var(--accent);
    }

    .history-item-domain {
      font-weight: 600;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 3px;
    }

    .history-item-url {
      color: var(--muted);
      word-break: break-all;
      font-size: 10px;
    }

    .changelog {
      font-size: 12px;
    }

    .changelog-badge {
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 8px;
      background: var(--grad);
      color: #fff;
      font-size: 10px;
    }

    .changelog-version {
      margin-top: 6px;
      font-weight: 600;
      color: var(--ink);
    }

    .changelog ul {
      margin: 2px 0 0;
      padding-left: 16px;
      color: var(--muted);
    }

    .credits {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted);
    }

    .credits a {
      color: var(--ink);
    }

    .history-empty {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed var(--line);
    }

    button.clear-history {
      margin-top: 8px;
      font-size: 11px;
      padding: 7px;
      background: var(--card-2);
      color: var(--muted);
      font-weight: 500;
    }

    button.clear-history:hover {
      filter: none;
      color: var(--ink);
    }
  </style>
</head>

<body>
  <header class="brand">
    <img src="icons/icon48.png" alt="">
    <div>
      <div class="brand-name">Embed Link Copier</div>
      <div class="brand-tagline">Share links that embed</div>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stats-item"><strong>Total:</strong> <span id="stats-total">0</span></div>
    <div class="stats-item"><strong>Today:</strong> <span id="stats-today">0</span></div>
    <div class="stats-item"><strong>X:</strong> <span id="stats-x">0</span> · <strong>Instagram:</strong> <span id="stats-instagram">0</span> · <strong>TikTok:</strong> <span id="stats-tiktok">0</span></div>
  </div>

  <div id="copy-sections"></div>

  <div class="settings-section">
    <h3>Services</h3>
    <div id="services-editor"></div>
  </div>

  <div class="divider"></div>

  <div class="history-section">
    <h3>History</h3>
    <div id="history-container">
      <div class="history-empty">No recent conversions</div>
    </div>
    <button class="clear-history" id="clear-history">Clear history</button>
  </div>

  <div class="divider"></div>

  <div id="changelog"></div>

  <div class="credits">Previews are made by third-party services (vxTwitter, FxEmbed, fxTikTok, tiktxk…), not by this extension. <a href="https://github.com/lepetitpaco/Embed-Link-Copier#credits" target="_blank" rel="noopener">Credits</a></div>

  <div id="status"></div>

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>

</html>
