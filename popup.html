<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      width: 320px;
      margin: 0;
      max-height: 600px;
      overflow-y: auto;
    }

    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .stats {
      background-color: #f0f0f0;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .stats-item {
      margin: 4px 0;
      color: #666;
    }

    .stats-item strong {
      color: #333;
    }

    button {
      width: 100%;
      margin: 5px 0;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background-color: #1d9bf0;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1a8cd8;
    }

    button:active {
      background-color: #1579b8;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      min-height: 20px;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
    }

    .divider {
      height: 1px;
      background-color: #e0e0e0;
      margin: 8px 0;
    }

    .section {
      margin-bottom: 12px;
    }

    .settings-section {
      margin-top: 12px;
    }

    .services-platform {
      margin: 6px 0;
      font-size: 12px;
    }

    .services-platform summary {
      cursor: pointer;
      font-weight: 600;
      color: #333;
      padding: 4px 0;
    }

    .service-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 4px 0;
    }

    .service-row input[type="checkbox"] {
      margin: 0 2px 0 0;
      cursor: pointer;
    }

    .service-row input[type="text"] {
      min-width: 0;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }

    .service-row .service-label {
      width: 36px;
      flex: 0 0 auto;
    }

    .service-row .service-domain {
      flex: 1;
    }

    .service-row.invalid input[type="text"] {
      border-color: #d93025;
    }

    .services-error {
      color: #d93025;
      font-size: 11px;
      min-height: 0;
    }

    .services-error:empty {
      display: none;
    }

    .services-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    button.editor-btn {
      width: auto;
      margin: 0;
      padding: 4px 8px;
      background-color: #f0f0f0;
      color: #333;
      font-size: 12px;
      font-weight: 500;
    }

    button.editor-btn:hover {
      background-color: #e0e0e0;
    }

    button.editor-btn:disabled {
      background-color: #f7f7f7;
      color: #bbb;
    }

    .history-section {
      margin-top: 12px;
    }

    .history-item {
      padding: 8px;
      margin: 4px 0;
      background-color: #f9f9f9;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .history-item:hover {
      background-color: #f0f0f0;
    }

    .history-item-domain {
      font-weight: 600;
      color: #1d9bf0;
      margin-bottom: 4px;
    }

    .history-item-url {
      color: #666;
      word-break: break-all;
      font-size: 10px;
    }

    .changelog {
      font-size: 12px;
    }

    .changelog summary {
      cursor: pointer;
      font-weight: 600;
      color: #333;
      padding: 4px 0;
    }

    .changelog-badge {
      margin-left: 6px;
      padding: 1px 5px;
      border-radius: 8px;
      background: #1d9bf0;
      color: #fff;
      font-size: 10px;
    }

    .changelog-version {
      margin-top: 6px;
      font-weight: 600;
      color: #555;
    }

    .changelog ul {
      margin: 2px 0 0;
      padding-left: 16px;
      color: #555;
    }

    .history-empty {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 12px;
    }

    .clear-history {
      margin-top: 8px;
      font-size: 11px;
      padding: 6px;
      background-color: #f0f0f0;
    }

    .clear-history:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>

<body>
  <div class="stats" id="stats">
    <div class="stats-item"><strong>Total:</strong> <span id="stats-total">0</span></div>
    <div class="stats-item"><strong>Today:</strong> <span id="stats-today">0</span></div>
    <div class="stats-item"><strong>X:</strong> <span id="stats-x">0</span> | <strong>Instagram:</strong> <span id="stats-instagram">0</span> | <strong>TikTok:</strong> <span id="stats-tiktok">0</span></div>
  </div>

  <div id="copy-sections"></div>

  <div class="settings-section">
    <h3>Services</h3>
    <div id="services-editor"></div>
  </div>

  <div class="divider"></div>

  <div class="history-section">
    <h3>History</h3>
    <div id="history-container">
      <div class="history-empty">No recent conversions</div>
    </div>
    <button class="clear-history" id="clear-history">Clear history</button>
  </div>

  <div class="divider"></div>

  <div id="changelog"></div>

  <div id="status"></div>

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>

</html>
